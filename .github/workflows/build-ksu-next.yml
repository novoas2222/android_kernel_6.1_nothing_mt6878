name: Build CMF Phone 1 Kernel with KernelSU Next

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libelf-dev libssl-dev python3 git repo
          # Install Bazel globally to avoid relying on missing repository tool wrappers
          sudo apt-get install -y bazel || true

      - name: Setup Workspace Directories
        run: |
          mkdir -p gki-build/common
          mkdir -p gki-build/build
          mkdir -p gki-build/modules
          mkdir -p gki-build/device-modules

      - name: Checkout Main Kernel (Current Fork)
        uses: actions/checkout@v4
        with:
          path: gki-build/common
          ref: mt6878/Tetris/16b

      - name: Checkout Build Module Repo
        uses: actions/checkout@v4
        with:
          repository: NothingOSS/android_kernel_build_nothing_mt6878
          ref: master
          path: gki-build/build

      - name: Checkout Kernel Modules Repo
        uses: actions/checkout@v4
        with:
          repository: NothingOSS/android_kernel_modules_nothing_mt6878
          ref: mt6878/Tetris/16b
          path: gki-build/modules

      - name: Checkout Device Modules Repo
        uses: actions/checkout@v4
        with:
          repository: NothingOSS/android_kernel_device_modules_6.1_nothing_mt6878
          ref: mt6878/Tetris/16b
          path: gki-build/device-modules

      - name: Integrate KernelSU Next
        working-directory: gki-build/common
        run: |
          # Download and install KernelSU Next via its official automated setup script
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s main
          
          # Inject KernelSU configurations safely into gki_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig

      - name: Run Kleaf Bazel Build
        working-directory: gki-build
        run: |
          # Link essential build definitions to the root workspace level where Bazel expects them
          ln -sf common/WORKSPACE WORKSPACE
          ln -sf common/BUILD.bazel BUILD.bazel
          
          # Find the available bazel execution binary (either common/tools/bazel, build/bazel, or global)
          BAZEL_BIN="bazel"
          if [ -f "common/tools/bazel" ]; then
              BAZEL_BIN="./common/tools/bazel"
          elif [ -f "build/bazel" ]; then
              BAZEL_BIN="./build/bazel"
          fi
          
          # Run the distribution compilation build target
          $BAZEL_BIN run --config=fast //common:gki_aarch64_dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMF-Tetris-KernelSU-Next
          path: |
            gki-build/out/android6.1-*/dist/Image
            gki-build/out/android6.1-*/dist/*.ko
